<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Albums</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <strong class="brand">Photo Albums</strong>
    <nav id="nav" hidden>
      <button data-view="photos" class="tab active">Photos</button>
      <button data-view="albums" class="tab">Albums</button>
      <button id="logout" class="link">Log out</button>
    </nav>
  </header>
  <div id="toast" role="status" aria-live="polite"></div>
  <main id="main"></main>
  <div id="viewer" class="viewer" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
